name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --extra dev --extra llm --extra embed
      - name: Lint (ruff)
        run: uv run ruff check src/ tests/
      - name: Type check (mypy)
        # Non-blocking: pre-existing debt (multi-package src layout, no explicit base).
        continue-on-error: true
        run: uv run mypy src/ --ignore-missing-imports
      - name: Tests + coverage
        run: uv run pytest tests/ --cov=src --cov-report=term-missing

  docs:
    # Guards the failure modes of the 2026-09 documentation audit: dead links in
    # the index, numbers in prose with no backing artefact, and citations of the
    # quarantined archive. See scripts/check_docs.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - name: Documentation integrity
        run: uv run --no-project python scripts/check_docs.py
