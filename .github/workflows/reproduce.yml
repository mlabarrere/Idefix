# Reproduce: a clean machine, the pinned public dataset, one command.
#
# Proves the newcomer path documented in the README still works end to end:
# fetch the dataset pinned in dataset/manifest.json (SHA-256 verified), restore it
# into the docker-compose PostgreSQL 17, run every offline pipeline stage, then
# build the webapp on the regenerated bundle. No secrets: no Telegram, no LLM key.
#
# Heavy (downloads the dataset, torch and the embedding model), so it runs weekly
# and on demand rather than on every push.
name: reproduce

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC

permissions:
  contents: read

concurrency:
  group: reproduce
  cancel-in-progress: false

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: uv sync --extra embed
      - name: Fetch dataset, restore database, run the offline pipeline
        run: uv run python scripts/bootstrap.py all --no-webapp
      - name: Build the webapp on the regenerated bundle
        working-directory: webapp
        run: npm ci && npm run build
      - name: Database logs on failure
        if: ${{ failure() }}
        run: docker compose --env-file /dev/null logs db
