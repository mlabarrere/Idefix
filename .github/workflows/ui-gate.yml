# ─────────────────────────────────────────────────────────────────────────────
# UI gate — Idéfix web app (webapp/) design-system CI.
#
# Every job here is BLOCKING as of 2026-09. Nothing runs with
# `continue-on-error`, because a check that is permanently red is a check
# nobody reads.
#
# `ui-contract` is a RATCHET, not a clean-run gate: the components predate
# design tokenization, so the accepted violation counts are recorded in
# webapp/ui-contract-baseline.json and may only go DOWN. Driving them to zero
# remains a Phase 2 deliverable; regressions fail the build today.
#
# Scope: this workflow is intentionally isolated from the repo's Python/pytest/
# ruff tooling — it only builds/checks the front-end under webapp/.
# ─────────────────────────────────────────────────────────────────────────────
name: ui-gate

on:
  pull_request:
    paths: ['webapp/**']
  push:
    paths: ['webapp/**']

# Least privilege: these jobs only need to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ui-gate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: webapp

jobs:
  typecheck:
    name: typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  i18n-parity:
    name: i18n-parity (6 locales · blocking)
    runs-on: ubuntu-latest
    # Blocking: key parity is also compiler-enforced (Messages type), and this
    # gate adds empty/__MISSING__/placeholder-drift detection. It passes clean.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run i18n:parity

  lint:
    name: lint (eslint · blocking)
    runs-on: ubuntu-latest
    # Blocking since 2026-09: the baseline is zero errors and zero warnings.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run lint

  ui-contract:
    name: ui-contract (design-system ratchet · blocking)
    runs-on: ubuntu-latest
    # Blocking since 2026-09, as a RATCHET rather than a clean-run gate: the
    # accepted counts live in webapp/ui-contract-baseline.json and may only go
    # down. A clean run is still a Phase 2 deliverable, but regressions are
    # caught today instead of hiding behind a permanently-red advisory job.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run ui:contract

  e2e:
    name: e2e (playwright smoke · chromium)
    runs-on: ubuntu-latest
    # Smoke/inspection harness (assertions, NOT visual regression). Chromium
    # only, no Docker.
    #
    # Analyst bundles are no longer committed (they are corpus-specific, so
    # publishing them would ship unreproducible numbers -- docs/limitations.md
    # Part III). The suite therefore generates a SYNTHETIC bundle first:
    # deterministic, obviously fake, and sufficient to drive the galaxy and the
    # channel table. Nothing it contains may be cited.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - uses: astral-sh/setup-uv@v3
      - name: Generate synthetic bundle
        working-directory: .
        run: uv run --no-project python scripts/make_fixture_bundle.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: webapp/playwright-report/
          retention-days: 7

  visual:
    name: visual regression (stubbed — Phase 3)
    runs-on: ubuntu-latest
    steps:
      # Placeholder only. Phase 3 will enable Dockerized Playwright visual
      # regression here (deterministic browser, mobile viewports, snapshot diff).
      # No checkout in this job, so the workflow default (webapp/) does not exist.
      - run: echo "visual regression is stubbed — enabled in Phase 3 (Dockerized Playwright)."
        working-directory: .
