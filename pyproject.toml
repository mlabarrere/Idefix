[project]
name = "disinfo-trace"
version = "0.1.0"
description = "Idéfix — Telegram disinformation propagator tracing system (MisinfoTeleGraph-FR)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # --- OFFLINE PIPELINE (the live system: ingest -> normalize -> graph -> score -> export) ---
    # Telegram MTProto ingestion
    "hydrogram>=0.1.4",
    "tgcrypto>=1.2",          # crypto acceleration for Hydrogram
    # Database (PostgreSQL) + schema migrations
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0",   # used by alembic/env.py only
    "alembic>=1.13",
    # Graph — in-memory multiplex (NO Neo4j/Kùzu): NetworkX primary, igraph for communities
    "networkx>=3.3",
    "python-igraph>=0.11",
    # Scoring / labeling: TF-IDF claim link + inter-annotator kappa
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    # Ingestor scheduling
    "apscheduler>=3.10",
    # Logging / config / validation
    "structlog>=24.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]
# Removed 2026-06-08 as dead/inertia (zero imports in src/scripts/tests, verified by grep):
#   fastembed (BGE-M3 — claim proximity now uses TF-IDF/scikit-learn), aiofiles,
#   pandas, plotly, pyvis (old Streamlit-viz frontend), imagehash + langdetect
#   (handlers.compute_media_hash/detect_language are unwired; media reuse uses Telegram
#   file_unique_id, France-targeting uses a multilingual lexicon).
# Removed 2026-06-10 (Lot 0 — stack slimming): fastapi, uvicorn, httpx (the legacy
#   live backend src/api/ is deleted; the shipped frontend is the static webapp/).
#   streamlit moved to the optional "session" extra (one-shot session_web.py only).

[project.optional-dependencies]
session = [
    # One-shot Telegram session-string generation UI (scripts/session_web.py).
    # Install on demand: uv sync --extra session
    "pillow>=12.3.0",      # transitive dep of streamlit — pins safe version (CVE HIGH fixed)
    "streamlit>=1.35",
]
ml = [
    # Install separately: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
    "torch>=2.3.0",
    "torch-geometric>=2.5",
]
embed = [
    # Parallel-track LOCAL embeddings (sentence-transformers). Install on demand:
    # uv sync --extra embed. Replaces the paid Mistral track for node/community/edge
    # classification with a free, fast, deterministic local model. Imported LAZILY
    # (src/embed only) so the default offline pipeline never loads torch by default.
    "sentence-transformers>=3.0",
]
llm = [
    # Parallel-track LLM classification (Mistral). Install on demand: uv sync --extra llm.
    # Official Mistral SDK (transport/auth/retry/parsing) + httpx kept explicit for the
    # MockTransport injected in tests (httpx is also a transitive dep of mistralai).
    # httpx was removed from the core deps on 2026-06-10 (legacy live backend deletion);
    # both are re-added here SCOPED to this optional extra only — the default offline
    # pipeline (ingest -> score -> export -> golden test) must never import an LLM client.
    "mistralai>=1.2,<2",
    "httpx>=0.27",
]
dev = [
    "gitpython>=3.1.58",   # transitive dep of pre-commit — pins safe version (8 CVE RCE/injection fixed)
    "setuptools>=83.0.0",  # transitive dep — pins safe version (CVE MANIFEST.in bypass fixed)
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = false
ignore_missing_imports = true
# `src/` has no __init__.py, so mypy inferred two module names for the same
# file ("dossier.builder" and "src.dossier.builder") and aborted before
# checking anything. Anchoring the package base at the repo root makes
# `src.<pkg>` the single canonical name -- the import form the code actually
# uses. This is the "src-layout debt" the CI job used to tolerate.
explicit_package_bases = true
mypy_path = "."

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
# This repo lives under a OneDrive-synced folder. uv's default hardlink install
# mode fails there (os error 396) because OneDrive locks files mid-operation.
# Copy mode is robust on cloud-synced drives. (If you also see "access denied"
# locks during upgrades, the deeper fix is to keep .venv outside OneDrive sync.)
link-mode = "copy"
